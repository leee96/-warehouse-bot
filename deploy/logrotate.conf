# /etc/logrotate.d/warehouse-bot
#
# Másolás helye: sudo cp deploy/logrotate.conf /etc/logrotate.d/warehouse-bot
# A bot journald-ba ír, de ha fájlba is logolsz (pino file transport), ez kezeli.

/opt/warehouse-bot/logs/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    sharedscripts
    postrotate
        systemctl kill -s HUP warehouse-bot.service 2>/dev/null || true
    endscript
}

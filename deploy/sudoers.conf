# /etc/sudoers.d/warehousebot
# Másolás: sudo cp deploy/sudoers.conf /etc/sudoers.d/warehousebot
# Jogosultság: sudo chmod 440 /etc/sudoers.d/warehousebot
#
# Engedélyezi a warehousebot usernek a service kezelést jelszó nélkül.

warehousebot ALL=(ALL) NOPASSWD: /bin/systemctl start warehouse-bot
warehousebot ALL=(ALL) NOPASSWD: /bin/systemctl stop warehouse-bot
warehousebot ALL=(ALL) NOPASSWD: /bin/systemctl restart warehouse-bot
warehousebot ALL=(ALL) NOPASSWD: /bin/systemctl status warehouse-bot
